name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/fetch-news.mjs'
      - 'config/providers.json'
      - 'config/sources.json'
      - 'PRIVACY.md'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mobile JavaScript, registries and privacy coverage
        run: |
          node --check android/app/src/main/assets/app.js
          node --check android/app/src/main/assets/media.js
          node --check android/app/src/main/assets/copilot-v2.js
          node --check android/app/src/main/assets/intelligence-v3.js
          node --check android/app/src/main/assets/ux-v31.js
          node --check scripts/fetch-news.mjs
          node <<'NODE'
          const fs=require('fs');
          const sources=JSON.parse(fs.readFileSync('config/sources.json','utf8')).sources||[];
          const providers=JSON.parse(fs.readFileSync('config/providers.json','utf8')).providers||[];
          const privacy=fs.readFileSync('PRIVACY.md','utf8');
          const missing=[...sources.map(x=>x.name),...providers.map(x=>x.name)].filter(name=>!privacy.includes(name));
          if(missing.length){console.error('PRIVACY.md missing registered names:',missing);process.exit(3)}
          if(sources.length<50||providers.length<15)process.exit(2);
          console.log('Mobile assets + privacy coverage OK:',sources.length,'sources,',providers.length,'providers');
          NODE
      - name: Refresh bundled AI-only data
        run: node scripts/fetch-news.mjs
      - name: Bundle offline fallback data
        run: |
          cp data/news.json android/app/src/main/assets/news.json
          cp config/providers.json android/app/src/main/assets/providers.json
          cp config/sources.json android/app/src/main/assets/sources.json
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Prepare downloads
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AI-News.apk
          sha256sum dist/AI-News.apk > dist/AI-News.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-News-Android-3.1
          path: |
            dist/AI-News.apk
            dist/AI-News.apk.sha256
          if-no-files-found: error
      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin refs/tags/android-latest --force
          NOTES="AI News Android 3.1 • UX & Privacy. Hardens Copilot/Intelligence integration and makes the app more intuitive: sequential intelligence-layer loading, Android back-button handling for sheets/modals/pages, provider-dossier navigation fix, safe source/reset confirmations, clearer legal/data controls, deep-linked Smart Watch notifications, first-run watch arming without old-story notification floods, native TTS without duplicate playback, lower-cost preference synchronization, and Settings links to Datenschutz & all sources plus Impressum at kosch.cloud. Privacy coverage is CI-checked against every registered source and provider. Intelligence Suite 3.0 features and nine widgets remain included. Debug-signed for direct testing."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest dist/AI-News.apk dist/AI-News.apk.sha256 --clobber
            gh release edit android-latest --title "AI News Android 3.1 • UX & Privacy" --notes "$NOTES"
          else
            gh release create android-latest dist/AI-News.apk dist/AI-News.apk.sha256 --title "AI News Android 3.1 • UX & Privacy" --notes "$NOTES"
          fi
