name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'config/providers.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline fallback data
        run: |
          cp data/news.json android/app/src/main/assets/news.json
          cp config/providers.json android/app/src/main/assets/providers.json
          cp config/sources.json android/app/src/main/assets/sources.json
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Prepare downloads
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AI-News.apk
          sha256sum dist/AI-News.apk > dist/AI-News.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-News-Android
          path: |
            dist/AI-News.apk
            dist/AI-News.apk.sha256
          if-no-files-found: error
      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin refs/tags/android-latest --force
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest dist/AI-News.apk dist/AI-News.apk.sha256 --clobber
            gh release edit android-latest --title "AI News Android • Latest" --notes "Modern Android build of AI News // Live. Swipe tabs, provider wire, governance radar, saved stories, official social links and AI News Copilot. Debug-signed for direct testing; source-first and no social scraping."
          else
            gh release create android-latest dist/AI-News.apk dist/AI-News.apk.sha256 --title "AI News Android • Latest" --notes "Modern Android build of AI News // Live. Swipe tabs, provider wire, governance radar, saved stories, official social links and AI News Copilot. Debug-signed for direct testing; source-first and no social scraping."
          fi
