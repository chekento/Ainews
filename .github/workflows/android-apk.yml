name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/fetch-news.mjs'
      - 'config/providers.json'
      - 'config/sources.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mobile JavaScript and registries
        run: |
          node --check android/app/src/main/assets/app.js
          node --check android/app/src/main/assets/media.js
          node --check scripts/fetch-news.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('config/sources.json','utf8')); JSON.parse(fs.readFileSync('config/providers.json','utf8')); console.log('Mobile assets OK')"
      - name: Refresh bundled AI-only data
        run: node scripts/fetch-news.mjs
      - name: Bundle offline fallback data
        run: |
          cp data/news.json android/app/src/main/assets/news.json
          cp config/providers.json android/app/src/main/assets/providers.json
          cp config/sources.json android/app/src/main/assets/sources.json
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Prepare downloads
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AI-News.apk
          sha256sum dist/AI-News.apk > dist/AI-News.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-News-Android-2.1
          path: |
            dist/AI-News.apk
            dist/AI-News.apk.sha256
          if-no-files-found: error
      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin refs/tags/android-latest --force
          NOTES="AI News Android 2.1 • Visual Intelligence. New A+Broadcast app identity and launcher icon, feed-provided article images with no page scraping, ten built-in cyber fallback visuals, richer branded news cards, refreshed repository identity, and the existing AI-only discovery, source controls, Copilot and eight configurable home-screen widgets. Publisher images are used only when explicitly exposed by RSS/Atom metadata; otherwise the app uses local vector fallbacks. Debug-signed for direct testing."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest dist/AI-News.apk dist/AI-News.apk.sha256 --clobber
            gh release edit android-latest --title "AI News Android 2.1 • Visual Intelligence" --notes "$NOTES"
          else
            gh release create android-latest dist/AI-News.apk dist/AI-News.apk.sha256 --title "AI News Android 2.1 • Visual Intelligence" --notes "$NOTES"
          fi
