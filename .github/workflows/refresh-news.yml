name: Refresh AI news

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write

concurrency:
  group: ai-news-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build AI-only news dataset
        run: node scripts/fetch-news.mjs
      - name: Commit updated dataset
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No dataset change."
            exit 0
          fi
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "data: refresh AI news feed"
          git pull --rebase origin main
          git push origin HEAD:main
