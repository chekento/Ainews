name: Refresh AI news

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'scripts/**'
      - 'config/**'
      - 'PRIVACY.md'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write

concurrency:
  group: ai-news-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application, aggregator, registries and privacy coverage
        run: |
          node --check app.js
          node --check android/app/src/main/assets/app.js
          node --check android/app/src/main/assets/copilot-v2.js
          node --check android/app/src/main/assets/intelligence-v3.js
          node --check android/app/src/main/assets/ux-v31.js
          node --check scripts/fetch-news.mjs
          node --check scripts/update-readme-news.mjs
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('config/sources.json','utf8'));
          const p=JSON.parse(fs.readFileSync('config/providers.json','utf8'));
          const privacy=fs.readFileSync('PRIVACY.md','utf8');
          const missing=[...(s.sources||[]).map(x=>x.name),...(p.providers||[]).map(x=>x.name)].filter(name=>!privacy.includes(name));
          if((s.sources||[]).length<50)process.exit(2);
          if(missing.length){console.error('PRIVACY.md missing registered names:',missing);process.exit(3)}
          console.log('JSON + privacy coverage OK:',s.sources.length,'sources,',p.providers.length,'providers');
          NODE
      - name: Build strict AI-only news dataset
        run: node scripts/fetch-news.mjs
      - name: Refresh repository frontpage
        run: node scripts/update-readme-news.mjs
      - name: Commit live dataset and frontpage
        run: |
          if git diff --quiet -- data/news.json README.md; then
            echo "No feed/frontpage change."
            exit 0
          fi
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json README.md
          git commit -m "data: refresh strict AI-only feed and frontpage"
          git pull --rebase origin main
          git push origin HEAD:main
