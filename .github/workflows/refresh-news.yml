name: Refresh AI news

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write

concurrency:
  group: ai-news-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application, aggregator and registries
        run: |
          node --check app.js
          node --check android/app/src/main/assets/app.js
          node --check scripts/fetch-news.mjs
          node --check scripts/update-readme-news.mjs
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('config/sources.json','utf8')); const p=JSON.parse(fs.readFileSync('config/providers.json','utf8')); if(s.sources.length<50) process.exit(2); console.log('JSON OK:',s.sources.length,'sources,',p.providers.length,'providers')"
      - name: Build strict AI-only news dataset
        run: node scripts/fetch-news.mjs
      - name: Refresh repository frontpage
        run: node scripts/update-readme-news.mjs
      - name: Commit live dataset and frontpage
        run: |
          if git diff --quiet -- data/news.json README.md; then
            echo "No feed/frontpage change."
            exit 0
          fi
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json README.md
          git commit -m "data: refresh strict AI-only feed and frontpage"
          git pull --rebase origin main
          git push origin HEAD:main
